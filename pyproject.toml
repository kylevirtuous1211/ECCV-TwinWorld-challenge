[project]
name = "twinworld"
version = "0.30.0"
description = "TwinWorld Challenge @ ECCV 2026 - the submitted pipeline"
requires-python = ">=3.11"

# Everything that runs without a GPU: packing, validating, scoring, the frame
# work and the labelled-volume construction.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "plyfile>=1.0",
    # cKDTree, for the nearest-neighbour queries both official 3D metrics are
    # defined in terms of. The clouds run to millions of points, so this is not
    # a convenience.
    "scipy>=1.11",
    # the random forest that labels the Gold Coast clouds
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Training and geometry export. Installed separately because the CUDA build of
# gsplat has to match the local toolchain.
# torch 2.5.1+cu121, gsplat 1.5.3, nvcc 12.1 is the combination every number in
# the README was measured on. The centre-depth behaviour finding 1 corrects is a
# property of that gsplat release.
gpu = [
    "torch==2.5.1",
    "gsplat==1.5.3",
]
# score_local.py withholds the rendering term rather than averaging over two of
# its three parts when LPIPS is unavailable, so this is optional on purpose.
lpips = [
    "torch>=2.4",
    "lpips>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinworld"]
